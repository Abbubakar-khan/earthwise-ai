name: Python CI

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app src
      - name: Run tests when present
        run: |
          if [ -d tests ]; then
            python -m pytest -q
          else
            echo "No tests directory found; compile check completed."
          fi
