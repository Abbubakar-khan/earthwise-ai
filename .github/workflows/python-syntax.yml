name: Python syntax checks

on:
  push:
    branches: [compat/streamlit-launch, feat/earthwise-ai-professional-v2]
  pull_request:
    branches: [main, compat/streamlit-launch]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and tests
        run: python -m compileall -q app src tests
